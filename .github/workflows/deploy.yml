name: Deploy Next.js App

on:
  push:
    branches:
      - master

# جلوگیری از اجرای هم‌زمان چند دیپلوی روی هم؛ اگه دو پوش پشت سر هم بیاد،
# دومی صف می‌شه و منتظر می‌مونه تا اولی تموم بشه (از تداخل روی PM2 جلوگیری می‌کنه)
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_NAME: student-time-management
  NODE_VERSION: '20'
  KEEP_RELEASES: 3

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      # یه شناسه‌ی کوتاه (۸ کاراکتری) از کامیت می‌سازیم تا مسیر پوشه‌ها روی
      # ویندوز خیلی طولانی نشه (ویندوز محدودیت ۲۶۰ کاراکتری MAX_PATH داره
      # و node_modules پروژه‌های Next.js معمولاً خیلی عمیق و بلندن)
      - name: Compute short commit SHA
        id: vars
        shell: cmd
        run: |
          set SHORT_SHA=%GITHUB_SHA:~0,8%
          echo short_sha=%SHORT_SHA%>>"%GITHUB_OUTPUT%"

      # هر دیپلوی توی یک پوشه‌ی کاملاً جدید چک‌اوت می‌شه.
      # این یعنی هیچ‌وقت با فایل‌های قفل‌شده‌ی پروسه‌ی در حال اجرای PM2 برخورد نمی‌کنیم.
      - name: Checkout code into isolated release folder
        uses: actions/checkout@v4
        with:
          path: releases/${{ steps.vars.outputs.short_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: releases/${{ steps.vars.outputs.short_sha }}/package-lock.json

      # npm ci بجای npm install: نصب تمیز و قطعی دقیقاً مطابق package-lock.json
      # + retry خودکار در صورت قطعی موقت شبکه/رجیستری npm
# استفاده از npm install به جای npm ci برای جلوگیری از ارور سینک نبودن فایل‌های قفل
      - name: Install dependencies (with retry)
        shell: cmd
        working-directory: releases/${{ steps.vars.outputs.short_sha }}
        run: |
          set RETRY_COUNT=0
          :RETRY
          set /a RETRY_COUNT+=1
          echo Install attempt %RETRY_COUNT% of 3...
          call npm install --no-audit --no-fund
          if %errorlevel%==0 goto INSTALL_OK
          if %RETRY_COUNT% geq 3 goto INSTALL_FAILED
          echo Install failed, waiting 5 seconds before retry...
          ping -n 6 127.0.0.1 >nul
          goto RETRY

          :INSTALL_FAILED
          echo Dependency install failed after 3 attempts.
          exit /b 1

          :INSTALL_OK
          echo Dependencies installed successfully.

      - name: Build Next.js project
        shell: cmd
        working-directory: releases/${{ steps.vars.outputs.short_sha }}
        run: npm run build

      # قبل از اینکه کاری به نسخه‌ی لایو داشته باشیم، مطمئن می‌شیم build واقعاً
      # کامل و سالم تولید شده. اگه این فایل نباشه یعنی build ناقص بوده.
      - name: Verify build output
        shell: cmd
        working-directory: releases/${{ steps.vars.outputs.short_sha }}
        run: |
          if not exist ".next\BUILD_ID" (
            echo Build verification failed: .next\BUILD_ID was not found.
            exit /b 1
          )
          echo Build verified successfully.

      # ==========================================================
      # از این خط به بعد یعنی build کاملاً موفق و verify شده.
      # فقط از همین لحظه به بعد PM2 و نسخه‌ی لایو رو لمس می‌کنیم.
      # ==========================================================

      - name: Remove previous PM2 process (if exists)
        shell: cmd
        continue-on-error: true
        run: pm2 delete "%APP_NAME%"

      - name: Start new release with PM2
        shell: cmd
        run: |
          pm2 start "${{ github.workspace }}\releases\${{ steps.vars.outputs.short_sha }}\node_modules\next\dist\bin\next" --name "%APP_NAME%" --cwd "${{ github.workspace }}\releases\${{ steps.vars.outputs.short_sha }}" -- start -H 0.0.0.0 -p 3000
          if %errorlevel% neq 0 exit /b %errorlevel%
          pm2 save

      - name: Confirm deployment is running
        shell: cmd
        run: pm2 describe "%APP_NAME%"

      # نگه‌داشتن چند نسخه‌ی آخر برای rollback دستی در صورت نیاز،
      # و پاک کردن نسخه‌های قدیمی‌تر برای جلوگیری از پر شدن دیسک.
      # این مرحله فقط بعد از دیپلوی *موفق* اجرا می‌شه، پس هیچ‌وقت نسخه‌ی
      # در حال اجرای فعلی رو پاک نمی‌کنه.
      - name: Clean up old releases
        shell: powershell
        run: |
          $releasesPath = "releases"
          if (Test-Path $releasesPath) {
            $releases = Get-ChildItem -Path $releasesPath -Directory | Sort-Object LastWriteTime -Descending
            $toDelete = $releases | Select-Object -Skip ([int]$env:KEEP_RELEASES)
            foreach ($dir in $toDelete) {
              Write-Host "Removing old release: $($dir.FullName)"
              Remove-Item -Recurse -Force $dir.FullName -ErrorAction SilentlyContinue
            }
          }