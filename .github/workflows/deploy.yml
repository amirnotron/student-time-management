name: Deploy Next.js App

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Stop PM2 process before update
        shell: cmd
        continue-on-error: true
        run: pm2 stop student-time-management

      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js & Enable Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Project
        run: npm run build

      - name: Run or Restart PM2 Safely
        shell: cmd
        run: |
          pm2 restart student-time-management || pm2 start node_modules/next/dist/bin/next --name "student-time-management" -- start -H 0.0.0.0 -p 3000
          pm2 save